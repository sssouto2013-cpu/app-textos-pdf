<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aplicativo de Teste de Palavras</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
}

/* Seção Mobile azul */
#mobileSection {
    display: none;
    padding: 16px;
    border-radius: 14px;
    background: #e7f1ff;
    border: 1px solid #bcd4ff;
    margin-bottom: 20px;
}

/* Botões Mobile */
.mobileButton {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    border: 1px solid #bcd4ff;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    margin-bottom: 10px;
}

/* Botão padrão */
button {
    padding: 10px 14px;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- ========================= -->
<!-- 📱 SEÇÃO MOBILE NO TOPO   -->
<!-- ========================= -->
<div id="mobileSection">
    <h2 style="margin-top: 0; display:flex; align-items:center; gap:8px;">
        <span class="material-icons">smartphone</span>
        Modo Mobile (Android / iPhone)
    </h2>

    <p>Selecione os arquivos diretamente do OneDrive, Google Drive ou armazenamento local.</p>

    <!-- Selecionar TXT -->
    <label for="mobileTxtInput" class="mobileButton">
        <span class="material-icons">description</span>
        Selecionar TXT manualmente
    </label>
    <input type="file" id="mobileTxtInput" accept=".txt" style="display:none;">

    <!-- Selecionar PDFs -->
    <label for="mobilePdfInput" class="mobileButton">
        <span class="material-icons">picture_as_pdf</span>
        Selecionar PDFs manualmente (múltiplos)
    </label>
    <input type="file" id="mobilePdfInput" accept="application/pdf" multiple style="display:none;">
</div>

<!-- ========================= -->
<!-- 🖥️ SEÇÃO DESKTOP NORMAL   -->
<!-- ========================= -->
<h2>Pasta de Trabalho (Modo Desktop)</h2>
<button id="chooseFolderButton">Escolher pasta</button>

<hr>

<h2>Iniciar Teste</h2>
<button id="startTestButton">Iniciar</button>

<div id="output"></div>

<script>
// Detecta Android ou iPhone
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

// Se for mobile → mostra seção azul e oculta "Escolher pasta"
if (isMobile) {
    document.getElementById("mobileSection").style.display = "block";

    const folderButton = document.getElementById("chooseFolderButton");
    if (folderButton) folderButton.style.display = "none";
}

// Variáveis globais
window.loadedTxtContent = "";
window.loadedPdfFiles = [];

// Carregar TXT manual
document.getElementById("mobileTxtInput").addEventListener("change", function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        window.loadedTxtContent = e.target.result;
        alert("TXT carregado com sucesso!");
    };
    reader.readAsText(file);
});

// Carregar PDFs manualmente
document.getElementById("mobilePdfInput").addEventListener("change", function(event) {
    window.loadedPdfFiles = event.target.files;
    alert(window.loadedPdfFiles.length + " PDFs carregados com sucesso!");
});

// =========================
// MODO DESKTOP: ESCOLHER PASTA
// =========================
document.getElementById("chooseFolderButton").addEventListener("click", async () => {
    try {
        const dirHandle = await window.showDirectoryPicker();
        let txtFile = null;
        let pdfFiles = [];

        for await (const entry of dirHandle.values()) {
            if (entry.kind === "file") {
                if (entry.name.toLowerCase().endsWith(".txt")) {
                    txtFile = entry;
                }
                if (entry.name.toLowerCase().endsWith(".pdf")) {
                    pdfFiles.push(entry);
                }
            }
        }

        if (!txtFile) {
            alert("Nenhum arquivo TXT encontrado na pasta.");
            return;
        }

        const txtData = await txtFile.getFile();
        window.loadedTxtContent = await txtData.text();

        window.loadedPdfFiles = [];
        for (const pdfEntry of pdfFiles) {
            const pdfData = await pdfEntry.getFile();
            window.loadedPdfFiles.push(pdfData);
        }

        alert("Arquivos carregados com sucesso!");
    } catch (err) {
        alert("Erro ao acessar a pasta.");
    }
});

// =========================
// INICIAR TESTE
// =========================
document.getElementById("startTestButton").addEventListener("click", () => {
    if (!window.loadedTxtContent) {
        alert("Nenhum TXT carregado.");
        return;
    }

    if (!window.loadedPdfFiles || window.loadedPdfFiles.length === 0) {
        alert("Nenhum PDF carregado.");
        return;
    }

    document.getElementById("output").innerHTML =
        "<h3>Teste iniciado!</h3>" +
        "<p>TXT carregado com " + window.loadedTxtContent.length + " caracteres.</p>" +
        "<p>PDFs carregados: " + window.loadedPdfFiles.length + "</p>";
});
</script>

</body>
</html>
